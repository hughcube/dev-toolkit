name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 发布后把版本号回写 master
      id-token: write          # OIDC 发布 + provenance 必需
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm run test --if-present

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest    # Trusted Publishing 需 npm >= 11.5.1

      - name: Publish
        run: npm publish --provenance     # 无 token，走 OIDC

      - name: Write version back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master FETCH_HEAD
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m "chore: release ${GITHUB_REF_NAME}"
          git push origin master
